server {
    listen 80;
    server_name localhost;

    # Drupal CMS 2 est installé dans ./app/web
    root /var/www/html/web;
    index index.php;

    client_max_body_size 100M;

    # Deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Drupal files directory - using prefix location with ^~ to give it priority
    # This allows Drupal to generate CSS/JS files dynamically if they don't exist
    # The ^~ modifier stops further regex matching, ensuring this takes precedence
    location ^~ /sites/ {
        location ~ /files/ {
            try_files $uri /index.php?$query_string;
            expires max;
            access_log off;
        }
    }

    # Fichiers statiques (CSS, JS, images, fonts)
    # Note: Files in sites/*/files/ are handled by the location block above
    location ~* \.(css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires max;
        access_log off;
    }

    # Routing principal de Drupal
    location / {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;   # IMPORTANT
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

}
