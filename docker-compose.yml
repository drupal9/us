services:
  php:
    build:
      context: .
      dockerfile: ./docker/build/php/Dockerfile
    container_name: us2php
    working_dir: /var/www/html
    volumes:
      - ./app/drupal:/var/www/html
      - ./docker/etc/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_MAX_UPLOAD=32M
    networks:
      - us2_net


  nginx:
    image: nginx:alpine
    container_name: us2nginx
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./app/drupal:/var/www/html
      - ./docker/etc/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - us2_net

  db:
    image: mariadb:11
    container_name: us2db
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=drupal
      - MARIADB_USER=drupal
      - MARIADB_PASSWORD=drupal
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - us2_net

volumes:
  db_data:

networks:
  us2_net:
    driver: bridge

